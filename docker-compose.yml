services:
  mysql:
    image: mysql:8.0
    container_name: civicguard-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: civicguard_db
      MYSQL_USER: civicguard
      MYSQL_PASSWORD: "2005"
      MYSQL_ROOT_PASSWORD: "2005"
    ports:
      - "3307:3306"
    volumes:
      - civicguard_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: civicguard-pma
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: civicguard
      PMA_PASSWORD: "2005"
    ports:
      - "8081:80"
    depends_on:
      - mysql

volumes:
  civicguard_mysql_data:
